<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Tu Mesa Bot - Pedidos</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Script principal de la interfaz de chat del cliente -->
  <script src="/js/cliente.js" defer></script>
</head>
<body class="h-dvh w-full overflow-hidden bg-slate-100 text-slate-800 antialiased font-sans">

  <!-- Contenedor principal Mobile-First tipo chat -->
  <div class="max-w-2xl mx-auto w-full h-dvh flex flex-col bg-slate-50 sm:border-x sm:border-slate-200 sm:shadow-sm overflow-hidden">

    <!-- ======================================================== -->
    <!-- ENCABEZADO FIJO SUPERIOR                                 -->
    <!-- ======================================================== -->
    <header class="shrink-0 bg-white border-b border-slate-200 px-3 py-2.5 sm:px-4 sm:py-3 flex items-center justify-between gap-2 z-20">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-full bg-indigo-600 text-white flex items-center justify-center text-lg shrink-0 shadow-sm" aria-hidden="true">
          🤖
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <h1 class="text-sm sm:text-base font-bold text-slate-900 leading-tight truncate">Tu Mesa Bot</h1>
            <span id="mesa-badge" class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-800 whitespace-nowrap">
              Mesa ...
            </span>
          </div>
          <p class="text-[11px] text-slate-500 flex items-center gap-1 leading-tight mt-0.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block" aria-hidden="true"></span>
            <span>Asistente de pedidos</span>
          </p>
        </div>
      </div>

      <button
        type="button"
        id="btn-solicitar-mesero"
        class="shrink-0 inline-flex items-center gap-1 px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl border border-amber-300 bg-amber-50 hover:bg-amber-100 active:bg-amber-200 text-amber-900 text-xs font-semibold transition whitespace-nowrap disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span aria-hidden="true">🙋‍♂️</span>
        <span>Solicitar Mesero</span>
      </button>
    </header>

    <!-- ======================================================== -->
    <!-- ÁREA CENTRAL DE MENSAJES (CON SCROLL AUTOMÁTICO)         -->
    <!-- ======================================================== -->
    <main id="chat-scroll-area" class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden px-3 py-4 sm:px-4 space-y-4">
      <div id="chat-messages" class="space-y-4" aria-live="polite">
        <!-- Las burbujas de bienvenida, menú, resumen y conversación se insertan aquí dinámicamente -->
      </div>

      <!-- Indicador visual de carga cuando el servidor está respondiendo -->
      <div id="typing-indicator" class="hidden flex items-end gap-2" aria-live="polite">
        <div class="w-7 h-7 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold shrink-0" aria-hidden="true">
          🤖
        </div>
        <div class="bg-white border border-slate-200 rounded-2xl rounded-bl-sm px-3.5 py-2.5 shadow-sm">
          <p class="text-xs text-slate-500 font-medium animate-pulse">Tu Mesa Bot está escribiendo...</p>
        </div>
      </div>
    </main>

    <!-- ======================================================== -->
    <!-- PIE FIJO INFERIOR: ACCESOS RÁPIDOS Y CAJA DE TEXTO       -->
    <!-- ======================================================== -->
    <footer class="shrink-0 bg-white border-t border-slate-200 px-3 pt-2 pb-3 sm:px-4 space-y-2 z-20">
      <!-- Fila compacta y deslizable de accesos rápidos -->
      <nav aria-label="Accesos rápidos del pedido" class="flex items-center gap-2 overflow-x-auto pb-0.5">
        <button
          type="button"
          id="quick-menu-btn"
          class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 text-xs font-semibold transition whitespace-nowrap disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span aria-hidden="true">📋</span>
          <span>Ver menú</span>
        </button>

        <button
          type="button"
          id="quick-resumen-btn"
          class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 text-xs font-semibold transition whitespace-nowrap disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span aria-hidden="true">🧾</span>
          <span>Mi pedido</span>
          <span id="quick-cart-count" class="hidden inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 rounded-full bg-indigo-600 text-white text-[10px] font-bold">0</span>
        </button>

        <button
          type="button"
          id="quick-vaciar-btn"
          class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-slate-100 hover:bg-rose-50 hover:text-rose-700 active:bg-rose-100 text-slate-600 text-xs font-semibold transition whitespace-nowrap disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span aria-hidden="true">🗑️</span>
          <span>Vaciar</span>
        </button>
      </nav>

      <!-- Formulario de mensaje al chatbot -->
      <form id="chat-form" class="flex items-center gap-2" novalidate>
        <label for="chat-input" class="sr-only">Escribe tu pedido o pregunta</label>
        <input
          type="text"
          id="chat-input"
          name="mensaje"
          maxlength="400"
          autocomplete="off"
          placeholder="Ej: 2 hamburguesas sin cebolla y 1 limonada..."
          class="flex-1 min-w-0 px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm text-slate-900 placeholder:text-slate-400 outline-none transition disabled:opacity-60"
        >
        <button
          type="submit"
          id="chat-submit-btn"
          class="shrink-0 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold px-4 py-2.5 rounded-xl text-sm shadow-sm transition disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap"
        >
          Enviar
        </button>
      </form>
    </footer>

  </div>

</body>
</html>
